name: Build and Release Privacy-Protected Augment Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Install vsce
        run: |
          npm install -g @vscode/vsce
      
      - name: Download latest Augment extension
        id: download
        run: |
          python scripts/download_extension.py
          # Extract version from downloaded file
          VERSION=$(ls download/*.vsix | sed 's/.*-\(.*\)\.vsix/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Downloaded version: $VERSION"
      
      - name: Extract VSIX
        run: |
          python scripts/extract_vsix.py
      
      - name: Inject privacy protection
        run: |
          python scripts/inject_privacy.py
      
      - name: Run verification tests
        run: |
          python -m pytest tests/ -v
      
      - name: Package modified VSIX
        id: package
        run: |
          python scripts/package_vsix.py
          # Get the output file path
          VSIX_FILE=$(ls output/*.vsix)
          echo "vsix_path=$VSIX_FILE" >> $GITHUB_OUTPUT
          echo "vsix_name=$(basename $VSIX_FILE)" >> $GITHUB_OUTPUT
      
      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Augment VSCode Extension - Privacy Protected
          
          ### Version: ${{ steps.download.outputs.version }}
          
          This release contains the Augment VSCode extension with integrated privacy protection.
          
          ### 🔒 Privacy Features
          - Session ID spoofing (UUID v4 randomization)
          - Device fingerprint spoofing (Machine IDs, UUIDs, serial numbers)
          - HTTP/HTTPS request interception and modification
          - System command output spoofing (ioreg, REG, wmic, git)
          - Telemetry data stripping
          - Fetch/Axios/XMLHttpRequest interception
          
          ### 📦 Installation
          
          ```bash
          code --install-extension ${{ steps.package.outputs.vsix_name }}
          ```
          
          Or install via VSCode UI:
          1. Extensions → `...` menu → Install from VSIX
          2. Select the downloaded file
          
          ### 🧪 Verification
          
          Check the installed extension's `extension.js` file:
          ```bash
          # Find extension location
          code --list-extensions --show-versions | grep augment
          
          # Check for injection marker
          # File should start with: // __AUG_INIT
          ```
          
          ### 📋 What's Modified
          
          - **extension/extension.js** - 7 lines injected at the beginning
          - **Injection marker**: `// __AUG_INIT`
          - **Base64-encoded payload** with privacy protection code
          - **Runs before extension loads** - deep integration
          
          ### ⚠️ Important
          
          - Use at your own risk
          - Not affiliated with Augment
          - Test in isolated environment first
          
          ### 🔗 Links
          
          - [Original Extension](https://marketplace.visualstudio.com/items?itemName=augment.vscode-augment)
          - [Repository](https://github.com/${{ github.repository }})
          - [Report Issues](https://github.com/${{ github.repository }}/issues)
          EOF
          
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.download.outputs.version }}-privacy
          name: Augment Privacy Protected v${{ steps.download.outputs.version }}
          body_path: release_notes.md
          files: |
            ${{ steps.package.outputs.vsix_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: augment-privacy-protected-${{ steps.download.outputs.version }}
          path: |
            output/*.vsix
            logs/*.log
          retention-days: 30

